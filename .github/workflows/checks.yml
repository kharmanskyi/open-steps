name: checks

on:
  pull_request:
  push:
    branches: [main]

# Read-only, and deliberately `pull_request` rather than `pull_request_target`:
# the latter would run a fork's code with a write token and this repository's
# secrets. Nothing here needs either.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: hooks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Both legs always report. A failure on one platform is the finding.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # Ten scenarios, in throwaway repositories with a throwaway home
      # directory. Needs no git identity and touches nothing outside them.
      - run: bash hooks/test.sh

  # Contributions arrive from outside the project and leave again under MIT, so
  # the trailer is where a contributor states they may release what they wrote.
  # Pull requests only: a push to main has no pull request range to read.
  sign-off:
    name: sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the range needs both sides of the pull request, not a shallow tip
          fetch-depth: 0
      - name: every commit carries a Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fails closed: an empty variable, an unreadable range or an empty
          # commit list is a failure. A gate that cannot see the commits has
          # proven nothing.
          set -euo pipefail
          : "${BASE:?the base sha is empty, cannot tell which commits belong here}"
          : "${HEAD:?the head sha is empty, cannot tell which commits belong here}"
          commits="$(git rev-list "$BASE..$HEAD")"
          if [ -z "$commits" ]; then
            echo "No commits between $BASE and $HEAD. Refusing to pass on nothing."
            exit 1
          fi
          missing=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            subject="$(git log -1 --format='%h %s' "$sha")"
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
                 | grep -q '[^[:space:]]'; then
              echo "  ok    $subject"
            else
              echo "  MISS  $subject"
              missing=$((missing + 1))
            fi
          done <<< "$commits"
          if [ "$missing" -gt 0 ]; then
            echo
            echo "$missing commit(s) have no Signed-off-by line."
            echo "Add one with: git commit -s"
            echo "Or sign every commit already made: git rebase --signoff $BASE"
            exit 1
          fi
          echo
          echo "Every commit in this pull request is signed off."

  manifest:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Unpinned on purpose: the manifest gets checked against the CLI people
      # actually run, so a schema change surfaces here instead of in an issue.
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
