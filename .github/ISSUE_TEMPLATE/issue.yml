name: Open an issue
description: A problem, an idea, or something the pack got wrong
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem
      description: >
        Plain words. If you have a fix or an idea in mind, say that too, but the
        problem on its own is enough. A new skill is welcome as an idea and has
        to be agreed in words before anyone writes it.
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Which tool
      description: Optional. Leave it empty if this is an idea and not about one tool.
      options:
        - Claude Code
        - Codex CLI
        - Cursor CLI
        - Cursor desktop app
        - Gemini CLI
        - Another tool
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Tool version and operating system
      description: >
        Optional. The version your tool prints, and your system. For an install
        problem, paste the output of `bash open-steps/doctor.sh` in the next box.
        Take out anything private first.
      placeholder: "For example: Gemini CLI 0.58.0 on Windows 11"
    validations:
      required: false
  - type: textarea
    id: paste
    attributes:
      label: Anything worth pasting
      description: >
        Optional. What your agent actually said, an error, a command that failed.
      render: text
  - type: checkboxes
    id: rights
    attributes:
      label: Before you send
      options:
        - label: Nothing here is confidential or a client's
          required: true
